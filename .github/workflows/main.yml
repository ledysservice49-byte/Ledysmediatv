name: Construire l'APK Ledys Média

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        
with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Créer le projet Expo et installer les modules
        run: |
          npx --yes create-expo-app@latest app --template blank 
--no-install
          cd app
          npm install
          npx expo install expo-video expo-build-properties expo-keep-awake expo-crypto expo-status-bar @react-native-async-storage/async-storage react-native-safe-area-context

      - name: Ajouter les fichiers Ledys Média
        run: |
          mkdir -p app/assets
          cp App.js 
app/App.js
          cp icon.png adaptive-icon.png splash.png logo-header.jpg app/assets/
          node patch-config.js

      - name: Générer le projet Android
        run: cd app && npx expo prebuild --platform android --no-install

      - name: Compiler l'APK
        run: cd 
app/android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: LedysMedia-APK
          path: app/android/app/build/outputs/apk/release/*.apk
